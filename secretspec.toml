# SecretSpec Manifest for abode
# Provider backend maps to standard Unix password-store (pass CLI)

[providers.pass]
type = "pass"

[secrets.GMAIL_CLIENT_ID]
provider = "pass"
path = "api/google/gmail_client_id"

[secrets.GMAIL_CLIENT_SECRET]
provider = "pass"
path = "api/google/gmail_client_secret"

[secrets.GDRIVE_CLIENT_ID]
provider = "pass"
path = "api/google/gdrive_client_id"

[secrets.GDRIVE_CLIENT_SECRET]
provider = "pass"
path = "api/google/gdrive_client_secret"
